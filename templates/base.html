{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        FoodBlog
        {% endblock %}
    </title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet"
          href="{% static 'css/like_animation.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <style>

        body{
            font-family: 'Inter', sans-serif;
        }

        .glass{
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .gradient-text{
            background: linear-gradient(
                90deg,
                #f97316,
                #ec4899
            );
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }

        .card-hover{
            transition: all .3s ease;
        }

        .card-hover:hover{
            transform: translateY(-5px);
        }

    </style>

</head>

<body class="bg-black text-white min-h-screen flex flex-col">

    <!-- Background -->
    <div class="fixed inset-0 -z-10 overflow-hidden">

        <div class="absolute top-0 left-0 w-96 h-96
                    bg-orange-500/20 blur-[140px]">
        </div>

        <div class="absolute bottom-0 right-0 w-96 h-96
                    bg-pink-500/20 blur-[140px]">
        </div>

    </div>

    <!-- Top Navbar -->
    <header class="sticky top-0 z-50 bg-black">

        <div class="bg-black border-b border-gray-800">

            <div class="max-w-7xl mx-auto px-6">

                <div class="flex items-center justify-between h-16">

                    <!-- Logo -->
                    <div class="flex items-center gap-3">

                        <div class="w-10 h-10 rounded-xl
                                    bg-gradient-to-r
                                    from-orange-500
                                    to-pink-500
                                    flex items-center justify-center
                                    shadow-lg shadow-orange-500/30">

                            🍰

                        </div>

                        <div>

                            <h1 class="font-bold text-xl">
                                FoodBlog
                            </h1>

                            <p class="text-xs text-gray-500">
                                Discover Recipes
                            </p>

                        </div>

                    </div>

                    <!-- Menu -->
                    <nav class="hidden md:flex items-center gap-3">

                        <a href="{% url 'home' %}"
                           class="px-4 py-2 rounded-xl hover:bg-white/5 transition">
                            Home
                        </a>

                        <a href="{% url 'recipes' %}"
                           class="px-4 py-2 rounded-xl hover:bg-white/5 transition">
                            Recipes
                        </a>

                        <a href="{% url 'dashboard' %}"
                           class="px-4 py-2 rounded-xl bg-orange-500/10 text-orange-400 transition">
                            Dashboard
                        </a>

                        <a href="{% url 'about' %}"
                           class="px-4 py-2 rounded-xl hover:bg-white/5 transition">
                            About
                        </a>

                    </nav>

                    <!-- User -->
                    <a href="{% url 'profile' %}"
                       class="flex items-center gap-3
                              bg-white/5
                              hover:bg-white/10
                              px-4 py-2 rounded-2xl transition">

                        <div class="w-9 h-9 rounded-full
                                    bg-gradient-to-r
                                    from-orange-500
                                    to-pink-500
                                    flex items-center justify-center
                                    font-bold">

                            {{ user.username|first|upper }}

                        </div>

                        <span class="font-medium">
                            {{ user.username }}
                        </span>

                    </a>

                </div>

            </div>

        </div>

    </header>

    <!-- Content -->

    <main class="flex-grow">

        {% block content %}
        {% endblock %}

    </main>

    <script src="{% static 'js/main.js' %}"></script>

{% include "partials/footer.html" %}
</body>

</html>
