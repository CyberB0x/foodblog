<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Food Blog</title>

    <style>

        body{
        font-family: Arial;
        background:#f5f5f5;
        margin:0;
        }

        header{
        background:#ff6b6b;
        color:white;
        padding:20px;
        text-align:center;
        font-size:24px;
        }

        .container{
        width:1000px;
        margin:auto;
        padding:20px;
        }

        /* GRID */
        .grid{
        display:grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap:20px;
        }

        /* CARD */
        .recipe-card{
        background:white;
        border-radius:12px;
        overflow:hidden;
        box-shadow:0 4px 10px rgba(0,0,0,0.1);
        transition:0.3s;
        }

        .recipe-card:hover{
        transform:translateY(-5px);
        }

        .recipe-card img{
        width:100%;
        height:200px;
        object-fit:cover;
        }

        .recipe-content{
        padding:15px;
        }

        .recipe-title{
        font-size:18px;
        font-weight:bold;
        margin-bottom:10px;
        }

        .recipe-title a{
        text-decoration:none;
        color:black;
        }

        .recipe-title a:hover{
        color:#ff6b6b;
        }

        .recipe-desc{
        color:#555;
        font-size:14px;
        }

</style>
</head>

<body>
<header>

<h1>🍰 My Food Blog</h1>
<p>Delicious recipes every day</p>

</header>

<input type="text" name="q" placeholder="Search recipes..."
value="{{ request.GET.q }}"
style="padding:10px; width:300px; border-radius:5px; border:1px solid #ccc;">

<div style="text-align:center; margin:20px;">

<a href="/category/desserts/" style="margin:5px; padding:8px 12px; background:#eee; border-radius:5px;">Desserts</a>
<a href="/category/drinks/" style="margin:5px; padding:8px 12px; background:#eee; border-radius:5px;">Drinks</a>
<a href="/category/cakes/" style="margin:5px; padding:8px 12px; background:#eee; border-radius:5px;">Cakes</a>

</div>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
