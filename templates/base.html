{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Food Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/like_animation.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">


</head>

<body class="bg-primary text-white font-sans">

  <!-- Navbar -->
  <nav class="bg-secondary p-4 shadow-lg flex justify-between items-center">
    <h1 class="text-xl font-bold">🍰 FoodBlog</h1>

    <div class="space-x-4">
      <a href="/" class="hover:text-accent">Home</a>
      <a href="/recipes" class="hover:text-accent">Recipes</a>
      <a href="/about" class="hover:text-accent">About</a>
    </div>
  </nav>

  <!-- Content -->
  <div class="container mx-auto p-6">
    {% block content %}
    {% endblock %}
  </div>


<script src="{% static 'js/main.js' %}"></script>
</body>
</html>
