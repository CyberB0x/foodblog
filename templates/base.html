{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Food Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/like_animation.css' %}">
    <!-- <link rel="stylesheet" href="{% static 'css/style.css' %}"> -->
</head>

<body class="bg-primary text-white font-sans">

  <!-- Navbar -->
  <nav class="bg-secondary p-4 shadow-lg flex justify-between items-center">
    <h1 class="text-xl font-bold">🍰 FoodBlog</h1>

    <div class="space-x-4">
      <a href="/" class="hover:text-accent">Home</a>
      <a href="/recipes" class="hover:text-accent">Recipes</a>
      <a href="/about" class="hover:text-accent">About</a>
    </div>
  </nav>

  <!-- Content -->
  <div class="container mx-auto p-6">
    {% block content %}
    {% endblock %}
  </div>

</body>

<script>
tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: '#111111',
          secondary: '#1f1f1f',
          accent: '#f59e0b',
        }
      }
    }
  }


// ❤️ LIKE
function likeRecipe(id) {
    const heart = document.getElementById(`heart-${id}`);
    const likesEl = document.getElementById(`likes-${id}`);

    let likedRecipes = JSON.parse(localStorage.getItem("likedRecipes")) || {};

    // если уже лайкнул → ничего не делаем
    if (likedRecipes[id]) {
        return;
    }

    // увеличиваем счетчик
    let currentLikes = parseInt(likesEl.innerText);
    likesEl.innerText = currentLikes + 1;

    // сохраняем
    likedRecipes[id] = true;
    localStorage.setItem("likedRecipes", JSON.stringify(likedRecipes));

    // ❤️ меняем иконку
    heart.classList.remove("fa-regular");
    heart.classList.add("fa-solid");

    // 💥 анимация
    heart.classList.add("like-pop");
    setTimeout(() => heart.classList.remove("like-pop"), 300);

    heart.parentElement.appendChild(plus);
    setTimeout(() => plus.remove(), 800);
}

document.addEventListener("DOMContentLoaded", () => {
    let likedRecipes = JSON.parse(localStorage.getItem("likedRecipes")) || {};

    Object.keys(likedRecipes).forEach(id => {
        const heart = document.getElementById(`heart-${id}`);
        if (heart) {
            heart.classList.remove("fa-regular");
            heart.classList.add("fa-solid");
        }
    });
});


// LIVE SEARCH
let timeout = null;
const input = document.getElementById("search-input");
const resultsBox = document.getElementById("search-results");

input.addEventListener("keyup", function() {
    clearTimeout(timeout);

    timeout = setTimeout(() => {
        const query = input.value;

        if (query.length < 2) {
            resultsBox.style.display = "none";
            return;
        }

        fetch(`/live-search/?q=${query}`)
            .then(res => res.json())
            .then(data => {
                resultsBox.innerHTML = "";

                if (data.results.length === 0) {
                    resultsBox.innerHTML = "<div style='padding:10px;'>No results 😢</div>";
                    resultsBox.style.display = "block";
                    return;
                }

                data.results.forEach(item => {
                    const div = document.createElement("div");
                    div.classList.add("search-item");

                    div.innerHTML = `
                        <img src="${item.image}">
                        <span>${item.title}</span>
                    `;

                    div.onclick = () => {
                        window.location.href = `/recipe/${item.id}/`;
                    };

                    resultsBox.appendChild(div);
                });

                resultsBox.style.display = "block";
            });

    }, 300);
});

// CLICK OUTSIDE
document.addEventListener("click", (e) => {
    if (!document.querySelector(".search-wrapper").contains(e.target)) {
        resultsBox.style.display = "none";
    }
});


function toggleFavorite(id){
    fetch(`/favorite/${id}/`, { method: "POST" })
    .then(res => res.json())
    .then(data => {
        const btn = document.getElementById(`fav-${id}`);

        if (data.status === "added"){
            btn.classList.add("active");
            btn.innerText = "⭐ Saved";
        } else {
            btn.classList.remove("active");
            btn.innerText = "⭐ Favorite";
        }
    });
}
</script>

</body>
</html>
