<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Food Blog</title>

    <style>

        body{
        font-family: Arial;
        background:#f5f5f5;
        margin:0;
        }

        header{
        background:#ff6b6b;
        color:white;
        padding:20px;
        text-align:center;
        font-size:24px;
        }

        .container{
        width:1000px;
        margin:auto;
        padding:20px;
        }

        /* GRID */
        .grid{
        display:grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap:20px;
        }

        /* CARD */
        .recipe-card{
        background:white;
        border-radius:12px;
        overflow:hidden;
        box-shadow:0 4px 10px rgba(0,0,0,0.1);
        transition:0.3s;
        }

        .recipe-card:hover{
        transform:translateY(-5px);
        }

        .recipe-card img{
        width:100%;
        height:200px;
        object-fit:cover;
        }

        .recipe-content{
        padding:15px;
        }

        .recipe-title{
        font-size:18px;
        font-weight:bold;
        margin-bottom:10px;
        }

        .recipe-title a{
        text-decoration:none;
        color:black;
        }

        .recipe-title a:hover{
        color:#ff6b6b;
        }

        .recipe-desc{
        color:#555;
        font-size:14px;
        }

        .search-bar{
        display:flex;
        justify-content:center;
        gap:10px;
        margin:20px;
        }

        .search-bar input{
            padding:12px;
            width:300px;
            border-radius:8px;
            border:1px solid #ddd;
        }

        .search-bar select{
            padding:12px;
            border-radius:8px;
            border:1px solid #ddd;
        }

        .search-bar button{
            padding:12px 20px;
            border:none;
            background:#ff6b6b;
            color:white;
            border-radius:8px;
            cursor:pointer;
        }

        .search-bar button:hover{
            background:#ff5252;
        }

        .search-wrapper{
            position:relative;
            width:350px;
            margin:20px auto;
        }

        #search-results{
            position:absolute;
            top:50px;
            width:100%;
            background:white;
            border-radius:8px;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
            display:none;
            z-index:1000;
        }

        .search-item{
            padding:10px;
            display:flex;
            align-items:center;
            gap:10px;
            cursor:pointer;
        }

        .search-item img{
            width:40px;
            height:40px;
            object-fit:cover;
            border-radius:5px;
        }

        .search-item:hover{
            background:#f5f5f5;
        }

</style>
</head>

<body>
<header>

<h1>🍰 My Food Blog</h1>
<p>Delicious recipes every day</p>

</header>

<div class="search-wrapper">
<form method="GET" action="/" class="search-bar">

    <input
        type="text"
        name="q"
        id="search-input"
        placeholder="🔍 Search desserts..."
        autocomplete="off">

    <button>Search</button>

</form>
<div id="search-results"></div>
</div>


<div style="text-align:center; margin:20px;">

<a href="/category/desserts/" style="margin:5px; padding:8px 12px; background:#eee; border-radius:5px;">Desserts</a>
<a href="/category/drinks/" style="margin:5px; padding:8px 12px; background:#eee; border-radius:5px;">Drinks</a>
<a href="/category/cakes/" style="margin:5px; padding:8px 12px; background:#eee; border-radius:5px;">Cakes</a>

</div>

<div class="container">
    {% block content %}
    {% endblock %}
</div>


<script>
let timeout = null;

const input = document.getElementById("search-input");
const resultsBox = document.getElementById("search-results");

// LIVE SEARCH
input.addEventListener("keyup", function() {
    clearTimeout(timeout);

    timeout = setTimeout(() => {
        const query = input.value;

        if (query.length < 2) {
            resultsBox.style.display = "none";
            return;
        }

        fetch(`/live-search/?q=${query}`)
            .then(res => res.json())
            .then(data => {

                resultsBox.innerHTML = "";

                // No results (внутри fetch!)
                if (data.results.length === 0) {
                    resultsBox.innerHTML = "<div style='padding:10px;'>No results 😢</div>";
                    resultsBox.style.display = "block";
                    return;
                }

                data.results.forEach(item => {
                    const div = document.createElement("div");
                    div.classList.add("search-item");

                    div.innerHTML = `
                        <img src="${item.image}">
                        <span>${item.title}</span>
                    `;

                    div.onclick = () => {
                        window.location.href = `/recipe/${item.id}/`;
                    };

                    resultsBox.appendChild(div);
                });

                resultsBox.style.display = "block";
            });

    }, 300);
});


// Закрытие при клике вне поиска (отдельный listener)
document.addEventListener("click", (e) => {
    if (!document.querySelector(".search-wrapper").contains(e.target)) {
        resultsBox.style.display = "none";
    }
});
</script>
</body>
</html>
