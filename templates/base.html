{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}FoodBlog{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/like_animation.css' %}">

</head>

<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">

<header class="sticky top-0 bg-white border-b z-50">

    <div class="max-w-7xl mx-auto px-4">

        <div class="h-16 flex items-center justify-between">

            <a href="{% url 'home' %}"
               class="flex items-center gap-3">

                <div class="w-10 h-10 rounded-lg bg-orange-500 text-white flex items-center justify-center">
                    🍰
                </div>

                <div>
                    <h1 class="font-bold text-lg">FoodBlog</h1>
                    <p class="text-xs text-gray-500">Simple recipes</p>
                </div>

            </a>

            <nav class="hidden md:flex items-center gap-6 text-sm">

                <a href="{% url 'home' %}">Home</a>
                <a href="{% url 'recipes' %}">Recipes</a>
                <a href="{% url 'dashboard' %}">Dashboard</a>
                <a href="{% url 'about' %}">About</a>

            </nav>

            {% if user.is_authenticated %}

            <a href="{% url 'profile' %}"
               class="flex items-center gap-2">

                <div class="w-9 h-9 rounded-full bg-orange-500 text-white flex items-center justify-center">

                    {{ user.username|first|upper }}

                </div>

                <span class="hidden sm:block">

                    {{ user.username }}

                </span>

            </a>

            {% endif %}

        </div>

    </div>

</header>

<main class="flex-1">

    {% block content %}
    {% endblock %}

</main>

{% include "partials/footer.html" %}

<script src="{% static 'js/main.js' %}"></script>

</body>
</html>
