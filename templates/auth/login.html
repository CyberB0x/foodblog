{% extends "base.html" %}

{% block content %}

<div class="max-w-md mx-auto mt-10 bg-white p-6 rounded-2xl shadow-xl text-black">
  <h2 class="text-2xl font-bold mb-6 text-center">Welcome Back 👋</h2>

  <form method="POST" class="space-y-4">
    {% csrf_token %}

    {% if form.errors %}
      <div class="bg-red-100 text-red-600 p-3 rounded-lg text-sm">
        Invalid username or password
      </div>
    {% endif %}

    <!-- Username -->
    <input
      type="text"
      name="username"
      placeholder="Username"
      class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
    >

    <!-- Password -->
    <div class="relative">
      <input
        type="password"
        name="password"
        id="login_password"
        placeholder="Password"
        class="w-full p-3 border rounded-lg pr-10 focus:outline-none focus:ring-2 focus:ring-blue-400"
      >
      <span onclick="togglePassword('login_password', this)"
            class="absolute right-3 top-3 cursor-pointer">🙈</span>
    </div>

    <button class="w-full bg-blue-500 hover:bg-blue-600 text-white py-3 rounded-lg transition">
      Login
    </button>
  </form>

  <p class="text-center mt-4 text-sm">
    No account?
    <a href="{% url 'register' %}" class="text-green-500 hover:underline">Register</a>
  </p>
</div>

{% endblock %}
