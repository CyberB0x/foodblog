{% extends "base.html" %}
{% block content %}

<div class="max-w-md mx-auto mt-10 bg-white p-6 rounded-xl shadow text-black">
  <h2 class="text-2xl font-bold mb-4 text-center">Login</h2>

  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}

    <button class="w-full bg-blue-500 text-white py-2 rounded mt-4">
      Login
    </button>
  </form>

  <p class="text-center mt-4">
    No account?
    <a href="{% url 'register' %}" class="text-green-500">Register</a>
  </p>
</div>

{% endblock %}
