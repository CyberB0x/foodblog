{% extends "base.html" %}

{% load socialaccount %}

{% block content %}

<div class="max-w-md mx-auto mt-10 bg-white p-8 rounded-2xl shadow-xl text-black">

    <h2 class="text-3xl font-bold text-center mb-3">
        Welcome Back 👋
    </h2>

    <p class="text-center text-gray-500 mb-8">
        Sign in to continue to FoodBlog
    </p>

    <a href="{% provider_login_url 'google' %}"
       class="w-full flex items-center justify-center gap-3 border border-gray-300 rounded-xl py-3 hover:bg-gray-50 transition">

        <svg class="w-5 h-5" viewBox="0 0 48 48">

        </svg>

        <span class="font-medium">
            Continue with Google
        </span>

    </a>

    <div class="mt-8 text-center text-sm text-gray-400">
        Secure authentication powered by Google
    </div>


</div>

{% endblock %}
