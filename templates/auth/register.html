{% extends "base.html" %}

{% block content %}

<div class="max-w-md mx-auto mt-10 bg-white p-6 rounded-xl shadow text-black">
  <h2 class="text-2xl font-bold mb-4 text-center">Register</h2>

  <form method="POST" class="space-y-4">
    {% csrf_token %}

    {% if form.errors %}
      <div class="bg-red-100 text-red-600 p-2 rounded">
        {{ form.errors }}
      </div>
    {% endif %}

    {{ form.username }}
    {{ form.email }}

    <!-- Password 1 -->
    <div class="relative">
      {{ form.password1 }}
      <span onclick="togglePassword('{{ form.password1.id_for_label }}', this)"
            class="absolute right-3 top-2 cursor-pointer">🙈️</span>
    </div>

    <!-- Password 2 -->
    <div class="relative">
      {{ form.password2 }}
      <span onclick="togglePassword('{{ form.password2.id_for_label }}', this)"
            class="absolute right-3 top-2 cursor-pointer">🙈</span>
    </div>

    <button class="w-full bg-green-500 text-white py-2 rounded">
      Sign Up
    </button>
  </form>

  <p class="text-center mt-4">
    Already have an account?
    <a href="{% url 'login' %}" class="text-blue-500">Login</a>
  </p>
</div>



{% endblock %}
