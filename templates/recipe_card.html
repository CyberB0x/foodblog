<a href="{% url 'recipe_detail' recipe.id %}"
   class="group block">

    <article class="efsun-card overflow-hidden h-full">

        <div class="relative overflow-hidden">

            <picture>

                <source
                    srcset="{{ recipe.image_webp.url }}"
                    type="image/webp">

                <img
                    src="{{ recipe.image.url }}"
                    alt="{{ recipe.title }}"
                    class="h-80 w-full object-cover transition duration-700 group-hover:scale-110"
                    loading="lazy"
                    decoding="async">

            </picture>

            <div class="absolute top-6 left-6">

                <span class="efsun-badge">

                    {{ recipe.category.name }}

                </span>

            </div>

        </div>

        <div class="p-8">

            <h3 class="brand-title text-3xl mb-5 group-hover:text-[#B78A3B] transition">

                {{ recipe.title }}

            </h3>

            <p class="brand-subtitle line-clamp-3">

                {{ recipe.description|truncatewords:20 }}

            </p>

            <div class="flex justify-between items-center mt-8">

                <div class="flex items-center gap-2">

                    <i class="fa-solid fa-star text-[#D4A437]"></i>

                    <span class="font-semibold">

                        {{ recipe.average_rating }}

                    </span>

                </div>

                <div class="text-sm text-[#8B776A]">

                    {{ recipe.created_at|date:"M d, Y" }}

                </div>

            </div>

        </div>

    </article>

</a>
